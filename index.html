<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        .caixa {
            max-width: 500px;
            margin: auto;
            padding: 35px;
            background: #1e293b;
            border-radius: 20px;
        }

        h1 {
            color: #38bdf8;
        }

        button {
            padding: 14px 25px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0369a1;
        }
    </style>
</head>

<body>

    <div class="caixa">
        <h1>Minha Interface 🚀</h1>

        <p>Bem-vindo ao meu primeiro site publicado!</p>

        <button onclick="alert('A interface está a funcionar!')">
            Testar interface
        </button>
    </div>

</body>
</html>
